<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Keabi Tech</title>
    <meta name="theme-color" content="#ff6a00" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
      .not-found-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .not-found-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-accent);
        border-radius: var(--radius-xl);
        padding: clamp(2rem, 5vw, 4rem);
        max-width: 580px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      }
      .code-404 {
        font-family: var(--font-mono);
        font-size: clamp(3.5rem, 8vw, 6rem);
        font-weight: 900;
        color: var(--accent-primary);
        line-height: 1;
        margin-bottom: 1rem;
        text-shadow: 0 0 25px rgba(255, 106, 0, 0.4);
      }
      .terminal-crumb {
        background: var(--bg-secondary);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border-radius: var(--radius-md);
        color: var(--text-muted);
        margin: 1.25rem 0 2rem 0;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="not-found-wrapper">
      <div class="not-found-card">
        <div class="brand-icon" style="font-size: 2.5rem; margin-bottom: 1rem;">&lt;/&gt;</div>
        <div class="code-404">404</div>
        <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-contrast);">System Route Not Found</h1>
        <p style="color: var(--text-secondary); line-height: 1.6;">
          The requested path does not exist on this server or has been migrated to production.
        </p>
        <div class="terminal-crumb">
          keabi@amu:~$ <span style="color:#ef4444">ERR_HTTP_NOT_FOUND (404)</span>
        </div>
        <div>
          <a href="/" class="btn btn-primary">
            &larr; Return to Workspace
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
